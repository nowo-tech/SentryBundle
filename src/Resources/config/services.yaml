---
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\SentryBundle\EventListener\SentryRequestListener:
    class: Nowo\SentryBundle\EventListener\SentryRequestListener
    arguments:
      $sentryHub: '@?Sentry\State\HubInterface'
      $config: '%nowo_sentry.request_listener%'
      $environment: '%kernel.environment%'
      $userContextProvider: '@Nowo\SentryBundle\User\SentryUserContextProviderInterface'
    # Tags are added conditionally in NowoSentryExtension based on configuration

  # 1.12+: Sentry user data of the logged-in user (arguments set in NowoSentryExtension from request_listener.*).
  Nowo\SentryBundle\User\DefaultSentryUserContextProvider:
    class: Nowo\SentryBundle\User\DefaultSentryUserContextProvider
    arguments:
      $sentryHub: '@?Sentry\State\HubInterface'
      # kernel.secret is read lazily per call (a missing APP_SECRET must not break the container).
      $parameters: '@?parameter_bag'

  # Deprecated port (removed in 2.0). UserContextProvidersPass picks the provider the host aliased or decorated.
  Nowo\SentryBundle\User\SentryUserContextProviderInterface:
    alias: Nowo\SentryBundle\User\DefaultSentryUserContextProvider

  # 1.13: framework-free port (UserRef).
  Nowo\SentryBundle\User\UserContextProviderInterface:
    alias: Nowo\SentryBundle\User\DefaultSentryUserContextProvider

  Nowo\SentryBundle\EventListener\SubRequestAccessDeniedContextListener:
    class: Nowo\SentryBundle\EventListener\SubRequestAccessDeniedContextListener
    arguments:
      $sentryHub: '@?Sentry\State\HubInterface'
      $config: '%nowo_sentry.sub_request_access_denied_listener%'
    # Tags are added conditionally in NowoSentryExtension based on configuration

  nowo_sentry.before_send_handler:
    class: Nowo\SentryBundle\Sentry\BeforeSendHandler
    arguments:
      $config: '%nowo_sentry.before_send_handler%'
      $reportedSqlExceptionRegistry: '@?Nowo\SentryBundle\Doctrine\DBAL\ReportedSqlExceptionRegistry'

  Nowo\SentryBundle\Sentry\EventPayloadTrimmer:
    class: Nowo\SentryBundle\Sentry\EventPayloadTrimmer
    arguments:
      $config: '%nowo_sentry.before_send_transaction_handler%'

  nowo_sentry.before_send_transaction_handler:
    class: Nowo\SentryBundle\Sentry\BeforeSendTransactionHandler
    arguments:
      $config: '%nowo_sentry.before_send_transaction_handler%'
      $trimmer: '@Nowo\SentryBundle\Sentry\EventPayloadTrimmer'

  Nowo\SentryBundle\Service\SentryErrorReporter:
    class: Nowo\SentryBundle\Service\SentryErrorReporter
    arguments:
      $sentryHub: '@?Sentry\State\HubInterface'
      $logger: '@?logger'
    public: true

  nowo_sentry.error_reporter:
    alias: Nowo\SentryBundle\Service\SentryErrorReporter
    public: true

  # 1.13: port of the reporter (REQ-ARCH-001 rule 1).
  Nowo\SentryBundle\Service\ErrorReporterInterface:
    alias: Nowo\SentryBundle\Service\SentryErrorReporter
    public: true

  Nowo\SentryBundle\EventListener\SentryUptimeBotListener:
    class: Nowo\SentryBundle\EventListener\SentryUptimeBotListener
    arguments:
      $config: '%nowo_sentry.uptime_bot_listener%'
    # Tags are added conditionally in NowoSentryExtension based on configuration
